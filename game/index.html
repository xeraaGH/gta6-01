<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coral Bay — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1620;
    font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  #topbar { position: absolute; top: 14px; left: 16px; right: 16px; display: flex;
    justify-content: space-between; align-items: flex-start; }
  #health-wrap { width: 220px; }
  #health-label { font-size: 12px; letter-spacing: 2px; opacity: 0.85; margin-bottom: 4px; }
  #health-bar { height: 12px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.5); border-radius: 6px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: #2ecc71; }
  #money { font-size: 26px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.7); }
  #stars { font-size: 26px; letter-spacing: 4px; color: rgba(255,255,255,0.35);
    text-shadow: 0 2px 4px rgba(0,0,0,0.7); text-align: right; }
  #objective { position: absolute; top: 64px; left: 16px; max-width: 430px;
    background: rgba(0,0,0,0.55); border-left: 4px solid #22aaff; padding: 10px 14px; border-radius: 4px; }
  #objective-text { font-size: 14px; line-height: 1.45; }
  #timer { display: none; margin-top: 6px; font-size: 22px; font-weight: 700; color: #ffd75e; }
  #minimap { position: absolute; right: 16px; bottom: 16px; width: 170px; height: 170px;
    border: 2px solid rgba(255,255,255,0.6); border-radius: 6px; background: rgba(0,0,0,0.4); }
  #speed { display: none; position: absolute; right: 200px; bottom: 20px; text-align: right;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
  #speed-val { font-size: 44px; font-weight: 800; line-height: 1; }
  #speed-unit { font-size: 13px; letter-spacing: 2px; opacity: 0.8; }
  #hint { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    font-size: 16px; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
  #toast { position: absolute; top: 150px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.65); padding: 10px 18px; border-radius: 20px; font-size: 15px;
    opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
  #hurt { position: fixed; inset: 0; pointer-events: none; z-index: 6; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(255,0,0,0.55) 100%); }

  /* Menus */
  #menu { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, rgba(8,40,70,0.92), rgba(10,70,90,0.88)); }
  #menu-card { max-width: 620px; padding: 36px 44px; text-align: center; }
  #menu-title { font-size: 64px; font-weight: 900; letter-spacing: 6px; margin: 0 0 4px;
    background: linear-gradient(90deg, #ffd75e, #ff8c42); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none; }
  #menu-sub { font-size: 15px; letter-spacing: 4px; opacity: 0.85; margin: 0 0 22px; }
  #menu-body { font-size: 15px; line-height: 1.6; opacity: 0.95; margin-bottom: 26px; text-align: left; }
  #menu-body p { margin: 10px 0; }
  .btn { pointer-events: auto; cursor: pointer; border: none; border-radius: 8px; padding: 14px 30px;
    font-size: 17px; font-weight: 700; color: #082338; background: #ffd75e; margin: 4px; }
  .btn:hover { background: #ffe08a; }
  .btn.ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,0.6); }
</style>
</head>
<body>
<canvas id="game" aria-label="Coral Bay: an open-world crime game. Drive, steal cars, run missions and outrun the police."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hurt"></div>

<div id="hud">
  <div id="topbar">
    <div id="health-wrap">
      <div id="health-label">HEALTH</div>
      <div id="health-bar"><div id="health-fill"></div></div>
    </div>
    <div id="money">$0</div>
    <div id="stars">☆☆☆☆☆</div>
  </div>
  <div id="objective"><div id="objective-text"></div><div id="timer"></div></div>
  <canvas id="minimap" width="170" height="170"></canvas>
  <div id="speed"><div id="speed-val">0</div><div id="speed-unit">KM/H</div></div>
  <div id="hint"></div>
  <div id="toast"></div>
</div>

<div id="menu">
  <div id="menu-card">
    <h1 id="menu-title">CORAL BAY</h1>
    <p id="menu-sub">AN OPEN-WORLD CRIME GAME</p>
    <div id="menu-body"></div>
    <button class="btn" id="menu-btn">Start the story</button>
    <button class="btn ghost" id="menu-btn2" style="display:none">New game</button>
  </div>
</div>

<script src="./vendor/three.min.js"></script>
<script src="./src/config.js"></script>
<script src="./src/audio.js"></script>
<script src="./src/world.js"></script>
<script src="./src/vehicles.js"></script>
<script src="./src/traffic.js"></script>
<script src="./src/player.js"></script>
<script src="./src/police.js"></script>
<script src="./src/missions.js"></script>
<script src="./src/hud.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
